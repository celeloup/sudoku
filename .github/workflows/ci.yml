name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck, lint, format, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # typecheck -> lint -> format:check -> test, in that order.
      # Runs as one step so a failure names the gate that failed.
      - run: npm run verify

      # Type-checks and bundles the browser harness. Catches integration
      # problems the unit tests cannot see, such as a mismatched element id.
      - run: npm run build
